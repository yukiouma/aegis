[workspace]
members = [
    "apps/desktop/aegis-desktop/src-tauri",
    "apps/server/aegis-server",
    "lib/crates/apis",
    "lib/crates/auth", "lib/crates/project",
    "lib/crates/user",
    "lib/crates/windows-utils",
]
resolver = "3"

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
argon2 = "0.5.3"
async-trait = "0.1.91"
thiserror = "2"
rand_core = { version = "0.6", default-features = false, features = [
    "getrandom",
] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
axum = { version = "0.8.9", features = ["multipart"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tower-http = { version = "0.7.0", features = ["trace"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "debug", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-axum = { version = "0.2.0", features = ["debug"] }
tower = "0.5.3"
# `serde` provides Serialize / Deserialize for wire-level DTOs (HTTP
# request / response bodies). Centralized here so every workspace
# crate that needs serialization inherits the same version and feature
# set.
serde      = { version = "1", features = ["derive"] }
# `serde_json` is the JSON codec used by axum's Json extractor. Pinned
# in the workspace so every consumer resolves the same version.
serde_json = "1"
# `reqwest` is the HTTP client used by the desktop app's outbound HTTP
# layer. Pinned in the workspace so it resolves to one version across
# crates and stays on rustls (no native-tls).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
# `base64` decodes the JWT payload (URL-safe, no-pad) on the desktop
# side so the tauri `current_user` command can read the `sub` claim
# without depending on the server's signing key. Centralized so the
# desktop `Cargo.toml` stays a one-liner.
base64 = "0.22"
