[package]
name = "logging-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
thiserror          = { workspace = true }
# `ulid` generates the time-sortable log ids that compose a trace id
# (mirrored from the `trace-id` crate — the two crates carry the
# same logic independently, not via a dep).
ulid               = { workspace = true }
# `moka` provides the dedup cache that remembers `batch_id`s for
# `LogIngestor::submit`; `sync` is enough (no async API surface).
moka               = { workspace = true }
# `crossbeam-channel` is the bounded mpsc between `submit` callers
# and the writer thread; sync `send` / `recv` is enough.
crossbeam-channel  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
