[package]
name = "logging-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
thiserror          = { workspace = true }
# `async-trait` gives `LogSender` an object-safe async method, so
# the submitter can hold an `Arc<dyn LogSender>` and stay
# runtime-agnostic.
async-trait = { workspace = true }
# `serde_json` encodes/decodes the pending-dir file format (a JSON
# array of log entries) and the tracing layer's per-event
# formatting. Already a workspace dep.
serde_json = { workspace = true }
# `tokio` supplies the current-thread runtime the worker thread
# runs the async `LogSender` on. `rt` is all that is needed — the
# batching timer is crossbeam's `recv_timeout`, not a tokio timer.
tokio = { workspace = true, features = ["rt"] }
# `ulid` generates the time-sortable log ids that compose a trace id
# (mirrored from the `trace-id` crate — the two crates carry the
# same logic independently, not via a dep).
ulid               = { workspace = true }
# `moka` provides the dedup cache that remembers `batch_id`s for
# `LogIngestor::submit`; `sync` is enough (no async API surface).
moka               = { workspace = true }
# `crossbeam-channel` is the bounded mpsc between `submit` callers
# and the writer thread; sync `send` / `recv` is enough.
crossbeam-channel  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
