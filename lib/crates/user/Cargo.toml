[package]
name = "user"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# `rand_core` is pulled in for `argon2::password_hash::rand_core::OsRng`,
# which is the random source used to generate argon2id salts in the
# usecase layer (`hash_password`). The `getrandom` feature on the
# workspace dependency must remain enabled so that `OsRng` is reachable.
rand_core = { workspace = true }

[dev-dependencies]
# Loads `.env` at test startup so live-DB integration tests can find
# `AEGIS_DATABASE_URL` without the user having to `source` it manually.
dotenvy = { workspace = true }
# Re-export the SQLx driver in `[dev-dependencies]` so the integration
# tests can build their own `PgPool` without going through the public
# API for connection setup. The library itself only needs `PgPool` as
# an opaque type behind `UserRepo::new`.
sqlx = { workspace = true }