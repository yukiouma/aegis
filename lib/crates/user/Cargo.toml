[package]
name = "user"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# `chrono` provides the `DateTime<Utc>` type used by the domain
# `User` and the usecase `UserView` to carry the `created_at` /
# `updated_at` columns surfaced by the repository. The `clock` feature
# keeps the binary small (no local time zones) while still enabling
# `NOW()`-style integration through `chrono::Utc`.
chrono = { workspace = true }
# `apis` provides the outbound `UserService` port the facade
# implements. Path-dep because both crates share the workspace.
apis = { path = "../apis" }

[dev-dependencies]
# Loads `.env` at test startup so live-DB integration tests can find
# `AEGIS_DATABASE_URL` without the user having to `source` it manually.
dotenvy = { workspace = true }
# Re-export the SQLx driver in `[dev-dependencies]` so the integration
# tests can build their own `PgPool` without going through the public
# API for connection setup. The library itself only needs `PgPool` as
# an opaque type behind `UserRepo::new`.
sqlx = { workspace = true }